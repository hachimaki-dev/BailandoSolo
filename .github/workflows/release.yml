name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_name: mac-arm64
            python_arch: arm64
            builder_flag: --mac --arm64
          - os: macos-latest
            target_name: mac-intel
            python_arch: x64
            builder_flag: --mac --x64
          - os: windows-latest
            target_name: windows-x64
            python_arch: x64
            builder_flag: --win --x64
          - os: ubuntu-latest
            target_name: linux-x64
            python_arch: x64
            builder_flag: --linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
          cache: 'pip'

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Setup FFmpeg for Bundling
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.target_name }}" = "mac-arm64" ]; then
            if [ -f "/opt/homebrew/bin/ffmpeg" ]; then
              cp /opt/homebrew/bin/ffmpeg dist/ffmpeg
            else
              brew install ffmpeg
              cp "$(which ffmpeg)" dist/ffmpeg
            fi
            chmod +x dist/ffmpeg
          elif [ "${{ matrix.target_name }}" = "mac-intel" ]; then
            curl -L -o ffmpeg-mac-x64.zip https://evermeet.cx/ffmpeg/getrelease/zip
            unzip -q ffmpeg-mac-x64.zip -d dist/
            chmod +x dist/ffmpeg
          elif [ "${{ matrix.target_name }}" = "windows-x64" ]; then
            if command -v ffmpeg &> /dev/null; then
              cp "$(which ffmpeg)" dist/ffmpeg.exe
            else
              curl -L -o ffmpeg-win.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
              unzip -q ffmpeg-win.zip
              cp ffmpeg-*/bin/ffmpeg.exe dist/ffmpeg.exe
            fi
          elif [ "${{ matrix.target_name }}" = "linux-x64" ]; then
            if ! command -v ffmpeg &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y ffmpeg
            fi
            cp "$(which ffmpeg)" dist/ffmpeg
            chmod +x dist/ffmpeg
          fi
          echo "FFmpeg bundled in dist/:"
          ls -la dist/

      - name: Build Python Backend Binary (PyInstaller - Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target_name }}" = "mac-intel" ]; then
            python -m PyInstaller --name bailandosolo-server --onefile --target-arch x86_64 --add-data "static:static" --hidden-import flask_cors --hidden-import yt_dlp server.py
          elif [ "${{ matrix.target_name }}" = "mac-arm64" ]; then
            python -m PyInstaller --name bailandosolo-server --onefile --target-arch arm64 --add-data "static:static" --hidden-import flask_cors --hidden-import yt_dlp server.py
          else
            python -m PyInstaller --name bailandosolo-server --onefile --add-data "static:static" --hidden-import flask_cors --hidden-import yt_dlp server.py
          fi
          chmod +x dist/bailandosolo-server

      - name: Verify Binary Architecture (Unix)
        if: runner.os != 'Windows'
        run: |
          file dist/bailandosolo-server
          if [ -f "dist/ffmpeg" ]; then
            file dist/ffmpeg
          fi

      - name: Build Python Backend Binary (PyInstaller - Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --name bailandosolo-server --onefile --add-data "static;static" --hidden-import flask_cors --hidden-import yt_dlp server.py

      - name: Install Frontend & Electron Dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build Vite Frontend
        run: |
          npm --prefix ui run build

      - name: Package with Electron Builder
        run: |
          npx electron-builder ${{ matrix.builder_flag }} --publish never

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

