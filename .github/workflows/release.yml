name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_name: mac-arm64
            builder_flag: --mac --arm64
          - os: macos-13
            target_name: mac-intel
            builder_flag: --mac --x64
          - os: windows-latest
            target_name: windows-x64
            builder_flag: --win --x64
          - os: ubuntu-latest
            target_name: linux-x64
            builder_flag: --linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Backend Binary (PyInstaller - Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --name bailandosolo-server --onefile --add-data "static:static" --hidden-import flask_cors --hidden-import yt_dlp server.py
          chmod +x dist/bailandosolo-server

      - name: Build Python Backend Binary (PyInstaller - Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name bailandosolo-server --onefile --add-data "static;static" --hidden-import flask_cors --hidden-import yt_dlp server.py

      - name: Install Frontend & Electron Dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build Vite Frontend
        run: |
          npm --prefix ui run build

      - name: Package with Electron Builder
        run: |
          npx electron-builder ${{ matrix.builder_flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
