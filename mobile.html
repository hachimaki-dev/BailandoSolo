<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicStream Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .breadcrumb button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .breadcrumb button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .folder-item, .song-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .folder-item:hover, .song-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .folder-item .icon, .song-item .icon {
            font-size: 2rem;
            min-width: 50px;
            text-align: center;
        }

        .folder-item .name, .song-item .name {
            flex: 1;
            font-weight: 600;
            word-break: break-word;
        }

        .download-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            transition: all 0.3s;
            white-space: nowrap;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .error {
            background: rgba(255, 87, 87, 0.3);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .empty {
            text-align: center;
            padding: 40px;
            opacity: 0.8;
        }

        .song-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 SonicStream Mobile</h1>
            <p>Descarga tu música favorita</p>
        </div>

        <div class="breadcrumb" id="breadcrumb" style="display: none;">
            <button onclick="goBack()">← Volver</button>
            <span id="currentPath"></span>
        </div>

        <div id="content">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <script>
        let currentFolder = null;

        async function loadFolders() {
            try {
                const response = await fetch('/api/library');
                const folders = await response.json();
                
                const content = document.getElementById('content');
                const breadcrumb = document.getElementById('breadcrumb');
                breadcrumb.style.display = 'none';
                
                if (folders.length === 0) {
                    content.innerHTML = '<div class="card empty">No hay carpetas en la biblioteca</div>';
                    return;
                }
                
                content.innerHTML = folders.map(folder => `
                    <div class="card folder-item" onclick="openFolder('${folder}')">
                        <div class="icon">📁</div>
                        <div class="name">${folder}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">Error al cargar carpetas: ' + error.message + '</div>';
            }
        }

        async function openFolder(folderName) {
            currentFolder = folderName;
            
            try {
                const response = await fetch(`/api/library/${encodeURIComponent(folderName)}`);
                const songs = await response.json();
                
                const content = document.getElementById('content');
                const breadcrumb = document.getElementById('breadcrumb');
                const currentPath = document.getElementById('currentPath');
                
                breadcrumb.style.display = 'flex';
                currentPath.textContent = folderName;
                
                if (songs.length === 0) {
                    content.innerHTML = '<div class="card empty">No hay canciones en esta carpeta</div>';
                    return;
                }
                
                content.innerHTML = songs.map(song => {
                    const thumbnail = song.thumbnail 
                        ? `<img src="${song.thumbnail}" class="song-thumbnail" alt="${song.title}">`
                        : '<div class="icon">🎵</div>';
                    
                    return `
                        <div class="card song-item">
                            ${thumbnail}
                            <div class="name">${song.title}</div>
                            <button class="download-btn" onclick="downloadSong('${folderName}', '${song.filename}', event)">
                                ⬇️ Descargar
                            </button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">Error al cargar canciones: ' + error.message + '</div>';
            }
        }

        function goBack() {
            currentFolder = null;
            loadFolders();
        }

        function downloadSong(folder, filename, event) {
            event.stopPropagation();
            const downloadPath = `${folder}/${filename}`;
            const downloadUrl = `/api/mobile/download/${encodeURIComponent(downloadPath)}`;
            
            // Create a temporary link and trigger download
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Show feedback
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '✓ Descargando...';
            btn.style.background = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
            }, 2000);
        }

        // Load folders on page load
        loadFolders();
    </script>
</body>
</html>
